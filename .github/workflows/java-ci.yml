name: Java CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Java 21 validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile, test, check formatting, and build
        run: ./gradlew --no-daemon clean build
  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned local deployment tools
        run: docker build -f infrastructure/docker/Dockerfile.tools -t skulker-tools:ci .
      - name: Validate Helm chart
        run: docker run --rm --entrypoint helm skulker-tools:ci lint infrastructure/helm/skulker
      - name: Validate deployment scripts and render both scaling modes
        run: |
          docker run --rm --entrypoint bash skulker-tools:ci -ec '
            for script in scripts/*.sh; do bash -n "$script"; done
            python3 -m py_compile scripts/*.py
            helm template skulker infrastructure/helm/skulker --namespace skulker > /tmp/autoscale.yaml
            helm template skulker infrastructure/helm/skulker --namespace skulker --set autoscaling.enabled=false > /tmp/fixed-workers.yaml
            helm lint infrastructure/helm/skulker --strict --set monitoring.enabled=true
            helm template skulker infrastructure/helm/skulker --namespace skulker --set monitoring.enabled=true > /tmp/monitoring.yaml
          '
      - name: Build API and worker runtime images without publishing
        run: bash scripts/build-images.sh
