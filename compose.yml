name: skulker

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: skulker
      POSTGRES_USER: skulker
      POSTGRES_PASSWORD: ${SKULKER_DB_PASSWORD:?Set SKULKER_DB_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skulker -d skulker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
